<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub</title>
</head>
<body>
    {% if user.is_authenticated %}
    <p>Hello, {{ user.username }}!</p>
    <p><a href="{% url 'users:profile' %}">My profile</a></p>


    {% else %}
    <p><a href="{% url 'users:register' %}">Registration</a></p>
    <p><a href="{% url 'users:login' %}">Sign up</a></p>
    {% endif %}
    <p><a href="{% url 'reviews:index' %}">All reviews</a></p>
</body>
</html>
