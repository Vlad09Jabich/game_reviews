<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub</title>
</head>
<body>
    {% if user.is_authenticated %}
    <p>Hello, {{ user.nickname }}! ({{ user.username }})</p>
    <p><a href="{% url 'users:profile' %}">My profile</a></p>

    {% if not is_author %}
    <p><a href="{% url 'main:become_author' %}">Become an author</a></p>
    {% endif %}

    {% if is_author %}
    <p><a href="{% url 'main:write_review' %}">Write review</a></p>
    {% endif %}

    {% else %}
    <p><a href="{% url 'users:register' %}">Registration</a></p>
    <p><a href="{% url 'users:login' %}">Sign up</a></p>
    {% endif %}
    <p><a href="{% url 'main:index' %}">All reviews</a></p>
</body>
</html>
