{% extends "base_accounts.html" %}

{% block title %}Изменение пароля{% endblock %}

{% block content %}
<div class="auth-card">
    <h2>Измените пароль</h2>
    
    <form method="post">
        {% csrf_token %}
        
        {% if form.errors %}
            <div style="color: #dc3545; background-color: #f8d7da; padding: 12px; border-radius: 6px; margin-bottom: 15px; font-size: 14px;">
                {{ form.errors }}
            </div>
        {% endif %}
        
        <div>
            <label for="id_old_password">Старый пароль:</label>
            {{ form.old_password }}
        </div>
        
        <div>
            <label for="id_new_password1">Новый пароль:</label>
            {{ form.new_password1 }}
        </div>
        
        <div>
            <label for="id_new_password2">Подтвердите пароль:</label>
            {{ form.new_password2 }}
        </div>
        
        <div class="auth-actions">
            <button type="submit">Изменить пароль</button>
            <a href="{% url 'reviews:main_page' %}" class="btn-secondary">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
