<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset password</title>
</head>
<body>
    <h2>Forgot password?</h2>
    <p>Enter your email and we will send you instructions to recover.</p>

    <form method="post">
        {% csrf_token %}

        {% if form.errors %}
            <div style="color: red;">
                {{ form.errors }}
            </div>
        {% endif %}

        <div>
            <label for="id_email">Email:</label>
            {{ form.email }}
        </div>

        <button type="submit">Send instructions</button>
    </form>
</body>
</html>
