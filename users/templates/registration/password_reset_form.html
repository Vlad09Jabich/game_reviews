{% extends "base_accounts.html" %}

{% block title %}Сброс пароля{% endblock %}

{% block content %}
<div class="auth-card">
    <h2>Восстановление пароля</h2>
    <p>Введите вашу почту, и мы отправим вам инструкции по восстановлению.</p>

    <form method="post">
        {% csrf_token %}

        {% if form.errors %}
            <div style="color: #dc3545; background-color: #f8d7da; padding: 12px; border-radius: 6px; margin-bottom: 15px; font-size: 14px;">
                {{ form.errors }}
            </div>
        {% endif %}

        <div>
            <label for="id_email">Email:</label>
            {{ form.email }}
        </div>

        <div class="auth-actions">
            <button type="submit">Отправить инструкции</button>
            <a href="{% url 'reviews:main_page' %}" class="btn-secondary">Назад</a>
        </div>
    </form>
</div>
{% endblock %}
