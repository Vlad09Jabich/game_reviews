<form method="post">
    {% csrf_token %}

    {% if form.non_field_errors %}
        <div style="color: red; font-weight: bold;">
            {{ form.non_field_errors }}
        </div>
    {% endif %}

    {% for field in form %}
        <div class="form-group">
            {{ field }}
            
            {% if field.errors %}
                <div style="color: red; font-size: 0.9em;">
                    {{ field.errors|striptags }}
                </div>
            {% endif %}
        </div>
    {% endfor %}
    <button type="submit">Sign up</button>
</form>
